<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Keuangan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

    header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white; padding: 20px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.5rem; }
    header span { font-size: 0.9rem; opacity: 0.8; }

    .container { max-width: 1050px; margin: 30px auto; padding: 0 20px; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 0.8rem; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .card .amount { font-size: 1.7rem; font-weight: 700; }
    .card.income .amount { color: #2e7d32; }
    .card.expense .amount { color: #c62828; }
    .card.balance .amount { color: #1a73e8; }

    .section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .section h2 { font-size: 1rem; margin-bottom: 16px; color: #555; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .form-grid input, .form-grid select {
      padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 0.9rem; width: 100%; outline: none;
    }
    .form-grid input:focus, .form-grid select:focus { border-color: #1a73e8; }
    .form-actions { margin-top: 12px; display: flex; gap: 10px; }
    .btn {
      padding: 9px 20px; border: none; border-radius: 8px;
      font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-success { background: #2e7d32; color: white; }
    .btn-success:hover { background: #1b5e20; }

    /* Filter */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-bar input, .filter-bar select {
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 0.875rem; outline: none;
    }
    .filter-bar input { flex: 1; min-width: 180px; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: #1a73e8; }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.8rem; color: #888; padding: 8px 12px; border-bottom: 1px solid #eee; }
    td { padding: 11px 12px; font-size: 0.9rem; border-bottom: 1px solid #f5f5f5; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .badge.in { background: #e8f5e9; color: #2e7d32; }
    .badge.out { background: #ffebee; color: #c62828; }
    .btn-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; }
    .btn-del:hover { color: #c62828; }

    .empty-msg { text-align: center; color: #aaa; padding: 20px; font-size: 0.9rem; }

    /* Bar chart */
    .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bar { width: 100%; border-radius: 6px 6px 0 0; }
    .bar.income-bar { background: #4caf50; }
    .bar.expense-bar { background: #ef5350; }
    .bar-label { font-size: 0.72rem; color: #888; margin-top: 5px; }

    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>💰 Dashboard Keuangan</h1>
  <span id="bulan-header">Agustus 2025</span>
</header>

<div class="container">

  <!-- Kartu ringkasan -->
  <div class="cards">
    <div class="card income">
      <h3>Total Pemasukan</h3>
      <div class="amount" id="total-income">Rp 0</div>
    </div>
    <div class="card expense">
      <h3>Total Pengeluaran</h3>
      <div class="amount" id="total-expense">Rp 0</div>
    </div>
    <div class="card balance">
      <h3>Saldo</h3>
      <div class="amount" id="total-balance">Rp 0</div>
    </div>
  </div>

  <!-- Form tambah transaksi -->
  <div class="section">
    <h2>➕ Tambah Transaksi</h2>
    <div class="form-grid">
      <input type="date" id="inp-tanggal" />
      <input type="text" id="inp-keterangan" placeholder="Keterangan" />
      <select id="inp-kategori">
        <option value="">-- Pilih Kategori --</option>
        <option>Pendapatan</option>
        <option>Kebutuhan</option>
        <option>Konsumsi</option>
        <option>Transportasi</option>
        <option>Utilitas</option>
        <option>Hiburan</option>
        <option>Lainnya</option>
      </select>
      <input type="number" id="inp-jumlah" placeholder="Jumlah (Rp)" min="0" />
      <select id="inp-tipe">
        <option value="in">Masuk</option>
        <option value="out">Keluar</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="tambahTransaksi()">Simpan Transaksi</button>
    </div>
  </div>

  <!-- Grafik -->
  <div class="section">
    <h2>📊 Grafik Bulanan</h2>
    <div class="bar-chart" id="bar-chart"></div>
  </div>

  <!-- Riwayat transaksi -->
  <div class="section">
    <h2>📋 Riwayat Transaksi</h2>

    <!-- Filter & Export -->
    <div class="filter-bar">
      <input type="text" id="filter-search" placeholder="🔍 Cari keterangan..." oninput="renderTabel()" />
      <select id="filter-tipe" onchange="renderTabel()">
        <option value="">Semua Tipe</option>
        <option value="in">Masuk</option>
        <option value="out">Keluar</option>
      </select>
      <select id="filter-kategori" onchange="renderTabel()">
        <option value="">Semua Kategori</option>
        <option>Pendapatan</option>
        <option>Kebutuhan</option>
        <option>Konsumsi</option>
        <option>Transportasi</option>
        <option>Utilitas</option>
        <option>Hiburan</option>
        <option>Lainnya</option>
      </select>
      <button class="btn btn-success" onclick="exportCSV()">⬇ Export CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Keterangan</th>
          <th>Kategori</th>
          <th>Jumlah</th>
          <th>Tipe</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabel-body"></tbody>
    </table>
    <div id="empty-msg" class="empty-msg" style="display:none">Belum ada transaksi.</div>
  </div>

</div>

<script>
  // Data awal
  let transaksi = [
    { id: 1, tanggal: '2025-08-25', keterangan: 'Gaji Bulanan', kategori: 'Pendapatan', jumlah: 4000000, tipe: 'in' },
    { id: 2, tanggal: '2025-08-24', keterangan: 'Belanja Bulanan', kategori: 'Kebutuhan', jumlah: 800000, tipe: 'out' },
    { id: 3, tanggal: '2025-08-23', keterangan: 'Freelance Design', kategori: 'Pendapatan', jumlah: 1200000, tipe: 'in' },
    { id: 4, tanggal: '2025-08-22', keterangan: 'Tagihan Internet', kategori: 'Utilitas', jumlah: 350000, tipe: 'out' },
    { id: 5, tanggal: '2025-08-21', keterangan: 'Makan & Minum', kategori: 'Konsumsi', jumlah: 600000, tipe: 'out' },
    { id: 6, tanggal: '2025-08-20', keterangan: 'Transport', kategori: 'Transportasi', jumlah: 400000, tipe: 'out' },
  ];
  let nextId = 7;

  function formatRp(n) {
    return 'Rp ' + n.toLocaleString('id-ID');
  }

  function formatTanggal(str) {
    if (!str) return '-';
    const d = new Date(str);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function updateKartu() {
    const income = transaksi.filter(t => t.tipe === 'in').reduce((s, t) => s + t.jumlah, 0);
    const expense = transaksi.filter(t => t.tipe === 'out').reduce((s, t) => s + t.jumlah, 0);
    document.getElementById('total-income').textContent = formatRp(income);
    document.getElementById('total-expense').textContent = formatRp(expense);
    document.getElementById('total-balance').textContent = formatRp(income - expense);
  }

  function renderTabel() {
    const search = document.getElementById('filter-search').value.toLowerCase();
    const tipe = document.getElementById('filter-tipe').value;
    const kat = document.getElementById('filter-kategori').value;

    const filtered = transaksi.filter(t => {
      return (!search || t.keterangan.toLowerCase().includes(search))
        && (!tipe || t.tipe === tipe)
        && (!kat || t.kategori === kat);
    }).sort((a, b) => b.tanggal.localeCompare(a.tanggal));

    const tbody = document.getElementById('tabel-body');
    tbody.innerHTML = '';
    document.getElementById('empty-msg').style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatTanggal(t.tanggal)}</td>
        <td>${t.keterangan}</td>
        <td>${t.kategori}</td>
        <td>${formatRp(t.jumlah)}</td>
        <td><span class="badge ${t.tipe}">${t.tipe === 'in' ? 'Masuk' : 'Keluar'}</span></td>
        <td><button class="btn-del" onclick="hapus(${t.id})" title="Hapus">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function tambahTransaksi() {
    const tanggal = document.getElementById('inp-tanggal').value;
    const keterangan = document.getElementById('inp-keterangan').value.trim();
    const kategori = document.getElementById('inp-kategori').value;
    const jumlah = parseInt(document.getElementById('inp-jumlah').value);
    const tipe = document.getElementById('inp-tipe').value;

    if (!tanggal || !keterangan || !kategori || !jumlah || jumlah <= 0) {
      alert('Lengkapi semua field terlebih dahulu!');
      return;
    }

    transaksi.push({ id: nextId++, tanggal, keterangan, kategori, jumlah, tipe });

    // Reset form
    document.getElementById('inp-tanggal').value = '';
    document.getElementById('inp-keterangan').value = '';
    document.getElementById('inp-kategori').value = '';
    document.getElementById('inp-jumlah').value = '';
    document.getElementById('inp-tipe').value = 'in';

    updateKartu();
    renderTabel();
    renderGrafik();
  }

  function hapus(id) {
    if (!confirm('Hapus transaksi ini?')) return;
    transaksi = transaksi.filter(t => t.id !== id);
    updateKartu();
    renderTabel();
    renderGrafik();
  }

  function exportCSV() {
    const header = ['Tanggal', 'Keterangan', 'Kategori', 'Jumlah', 'Tipe'];
    const rows = transaksi.map(t => [
      t.tanggal, t.keterangan, t.kategori, t.jumlah, t.tipe === 'in' ? 'Masuk' : 'Keluar'
    ]);
    const csv = [header, ...rows].map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'transaksi.csv';
    a.click(); URL.revokeObjectURL(url);
  }

  function renderGrafik() {
    const bulan = {};
    transaksi.forEach(t => {
      const key = t.tanggal.substring(0, 7);
      if (!bulan[key]) bulan[key] = { income: 0, expense: 0 };
      if (t.tipe === 'in') bulan[key].income += t.jumlah;
      else bulan[key].expense += t.jumlah;
    });

    const keys = Object.keys(bulan).sort().slice(-4);
    const maxVal = Math.max(...keys.flatMap(k => [bulan[k].income, bulan[k].expense]), 1);
    const chartH = 110;

    const chart = document.getElementById('bar-chart');
    chart.innerHTML = '';

    keys.forEach(k => {
      const label = new Date(k + '-01').toLocaleDateString('id-ID', { month: 'short', year: '2-digit' });
      const iH = Math.round((bulan[k].income / maxVal) * chartH);
      const eH = Math.round((bulan[k].expense / maxVal) * chartH);

      chart.innerHTML += `
        <div class="bar-wrap">
          <div class="bar income-bar" style="height:${iH}px" title="Pemasukan: ${formatRp(bulan[k].income)}"></div>
          <span class="bar-label">${label}</span>
        </div>
        <div class="bar-wrap">
          <div class="bar expense-bar" style="height:${eH}px" title="Pengeluaran: ${formatRp(bulan[k].expense)}"></div>
          <span class="bar-label">${label}</span>
        </div>
      `;
    });
  }

  // Set default tanggal hari ini
  document.getElementById('inp-tanggal').valueAsDate = new Date();

  // Init
  updateKartu();
  renderTabel();
  renderGrafik();
</script>
</body>
</html>
